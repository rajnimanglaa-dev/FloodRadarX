# Database Configuration (MySQL 8.0)
spring.datasource.url=jdbc:mysql://localhost:3306/floodradarx?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=Paavani
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true

# Logging Configuration
logging.level.org.springframework.security.config.annotation.authentication.configuration.InitializeUserDetailsBeanManagerConfigurer=ERROR

# Security & JWT Configuration
jwt.secret=FloodRadarXSuperSecureSecretKeyForJwtAuthenticationMustBeAtLeast256BitsLong2026November
jwt.expiration-ms=86400000

# Python ML Prediction Service Integration (Module D)
# Point this to your teammate's Python FastAPI or Flask server URL
python.ml.service.url=http://localhost:5000/api/predict

# SMS Provider Configuration (Module I)
# Options: SIMULATED (for testing without cellular gateway charges), TWILIO, FAST2SMS
sms.provider=SIMULATED
sms.enabled=true
sms.cooldown-minutes=60

# Swagger / OpenAPI Documentation (Module L)
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha

# Weather & Satellite Integration Placeholders (Module E)
# India Meteorological Department (IMD) API Endpoint:
# Obtain API access from: https://mausam.imd.gov.in / National Data Portal (data.gov.in)
imd.api.baseUrl=https://mausam.imd.gov.in/api
imd.api.apiKey=YOUR_IMD_API_KEY_HERE

# ISRO-NRSC Bhuvan Flood Portal Endpoint:
# Information: https://bhuvan-app1.nrsc.gov.in/disaster/disaster.php?id=flood
isro.bhuvan.api.baseUrl=https://bhuvan-app1.nrsc.gov.in/api
isro.bhuvan.api.apiKey=YOUR_BHUVAN_TOKEN_HERE

# Central Water Commission (CWC) / India-WRIS Portal:
# Access: https://indiawris.gov.in
cwc.wris.api.baseUrl=https://indiawris.gov.in/api
